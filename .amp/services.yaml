services:
  slp-preview:
    command: >-
      GITHUB_ACTIONS=true npm run build:web &&
      GITHUB_ACTIONS=true npm run preview -- --host 0.0.0.0 --port "$PORT"
    health: /slp/
    portal:
      url: /slp/
      title: SLP Preview
      description: Production-fidelity preview of the GitHub Pages build.
